spring.application.name=customer-feedback-portal-test

# Use in-memory H2 for all automated tests so there are no file lock conflicts
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Disable H2 console in tests
spring.h2.console.enabled=false

# Suppress debug logs during tests
logging.level.root=WARN
logging.level.com.feedback.portal=INFO

# Attachment storage (temp dir for tests)
app.attachment.storage-dir=./target/test-uploads

# SpringDoc
springdoc.swagger-ui.enabled=false
