
spring.application.name=customer-feedback-portal

# File-based H2 database (dev)
spring.datasource.url=jdbc:h2:file:./data/feedbackdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# File upload — attachments
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Attachment storage directory (relative to working dir)
app.attachment.storage-dir=./uploads
app.attachment.allowed-extensions=jpg,jpeg,png,gif,pdf,txt,docx,xlsx
app.attachment.max-size-bytes=10485760

# Reduce security noise in production
logging.level.org.springframework.security=WARN
logging.level.com.feedback.portal=INFO
logging.level.org.springframework.web=WARN

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true